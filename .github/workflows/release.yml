name: Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Tag release
        if: github.ref == 'refs/heads/main'
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: v
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ steps.tag.outputs.new_tag }}" ]; then
            VERSION="${{ steps.tag.outputs.new_tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_no_v=${VERSION#v}" >> $GITHUB_OUTPUT
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '9.1.0'
          arguments: build -Pversion=${{ steps.version.outputs.version_no_v }}
      - name: Generate checksums
        run: |
          cd build/libs
          sha256sum OpiOwl-26.1-v*.jar > OpiOwl-26.1-v${{ steps.version.outputs.version_no_v }}.sha256
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/libs/OpiOwl-26.1-v*.jar
            build/libs/OpiOwl-26.1-v*.sha256
